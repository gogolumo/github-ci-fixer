[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "release"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
"tools/benchmark.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
files = ["free/github-ci-fixer/scripts", "tools"]
